name: Background Screening Checks
on:
  pull_request:
    paths:
      - 'app/api/employees/background-screening/**'
      - 'app/(workspace)/employees/background-screening/**'
      - 'lib/backgroundScreening/**'
      - 'tests/background-screening-workflow.test.mjs'
      - 'components/employees/EmployeeDirectory.tsx'
      - 'components/layout/Sidebar.tsx'
      - 'supabase/migrations/20261122090000_employee_background_screening.sql'
      - '.github/workflows/background-screening.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/background-screening-workflow.test.mjs
      - run: npm run typecheck
