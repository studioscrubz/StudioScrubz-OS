name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  job-finished-photo-postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start native PostgreSQL
        run: sudo systemctl start postgresql.service
      - name: Build isolated schema-only Job completion database
        run: |
          sudo -u postgres createdb studioscrubz_finished_photo_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_finished_photo_test -f supabase/tests/job_finished_photo_completion_fixture.sql
      - name: Verify external migration rollback
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_finished_photo_test -f supabase/tests/job_finished_photo_completion_rollback.sql
      - name: Apply actual finished-photo migration
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_finished_photo_test -f supabase/migrations/20261027003242_require_finished_job_photo_before_completion.sql
      - name: Verify completion, authorization, and team clock-out
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_finished_photo_test -f supabase/tests/job_finished_photo_completion_postgres.sql

  workforce-time-off-postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start native PostgreSQL
        run: sudo systemctl start postgresql.service
      - name: Create isolated schema-only test database
        run: |
          sudo -u postgres createdb studioscrubz_time_off_test
          sudo -u postgres psql --set ON_ERROR_STOP=1 --dbname studioscrubz_time_off_test --file supabase/tests/workforce_time_off_phase_1_fixture.sql
      - name: Verify externally managed rollback
        run: sudo -u postgres psql --set ON_ERROR_STOP=1 --dbname studioscrubz_time_off_test --file supabase/tests/workforce_time_off_phase_1_rollback.sql
      - name: Apply actual migration
        run: sudo -u postgres psql --set ON_ERROR_STOP=1 --dbname studioscrubz_time_off_test --file supabase/migrations/20261025145923_workforce_time_off_phase_1.sql
      - name: Run authorization and workflow tests
        run: sudo -u postgres psql --set ON_ERROR_STOP=1 --dbname studioscrubz_time_off_test --file supabase/tests/workforce_time_off_phase_1_postgres.sql

  non-database-checks:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run build:production
      - run: npm run check:diff

  jobsite-gps-postgres:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start native PostgreSQL
        run: sudo systemctl start postgresql.service
      - name: Build schema-only GPS test database
        run: |
          sudo -u postgres createdb studioscrubz_jobsite_gps_test
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/tests/workforce_time_off_phase_1_fixture.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/tests/jobsite_gps_fixture.sql
      - name: Test external migration rollback
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/tests/jobsite_gps_rollback.sql
      - name: Apply actual GPS migration
        run: |
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/migrations/20261025164300_jobsite_gps_arrival_v1.sql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/migrations/20261025194500_walkthrough_jobsite_gps.sql
      - name: Verify GPS authorization and payroll isolation
        run: sudo -u postgres psql -v ON_ERROR_STOP=1 -d studioscrubz_jobsite_gps_test -f supabase/tests/jobsite_gps_postgres.sql
